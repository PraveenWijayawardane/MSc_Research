version: 1

organization:
  name: healthcare-research-lab
  timezone: Asia/Colombo

# Devices are classified by subnet when there is no exact asset definition.
# Exact entries under critical_assets or asset_overrides take priority.
network_zones:
  healthcare_lab:
    description: Main healthcare research laboratory network
    subnets:
    - 192.168.100.0/24

    default_role: workstation
    trust_level: internal
    sensitivity: normal
    managed: true

# Only important healthcare infrastructure must be defined individually.
critical_assets:
  192.168.100.30:
    hostname: ehr-app-server-01
    role: ehr_app
    asset_type: application_server
    sensitivity: high
    trust_level: protected
    managed: true
    criticality: high
    tags:
    - ehr
    - application
    - healthcare

  192.168.100.40:
    hostname: ehr-db-server-01
    role: database
    asset_type: database_server
    sensitivity: critical
    trust_level: protected
    managed: true
    criticality: critical
    tags:
    - ehr
    - database
    - patient_data

  192.168.100.50:
    hostname: file-server-01
    role: file_server
    asset_type: file_server
    sensitivity: high
    trust_level: protected
    managed: true
    criticality: high
    tags:
    - file_storage
    - healthcare_documents

  192.168.100.100:
    hostname: monitoring-server-01
    role: monitoring
    asset_type: security_monitoring
    sensitivity: high
    trust_level: trusted
    managed: true
    trusted: true
    criticality: high
    tags:
    - wazuh
    - opensearch
    - monitoring

# Exceptional systems that cannot use the zone's default workstation role.
asset_overrides:
  192.168.100.10:
    hostname: attacker-kali
    role: attacker
    asset_type: security_testing
    sensitivity: normal
    trust_level: untrusted
    managed: false
    trusted: false
    criticality: low
    tags:
    - kali
    - penetration_testing
    - attacker_simulation

  192.168.100.21:
    hostname: admin-pc-01
    role: admin_workstation
    asset_type: privileged_workstation
    sensitivity: high
    trust_level: trusted
    managed: true
    trusted: true
    criticality: high
    tags:
    - administration
    - privileged_access

  192.168.100.120:
    hostname: zeek-sensor-02
    role: network_sensor
    asset_type: security_sensor
    sensitivity: high
    trust_level: trusted
    managed: true
    trusted: true
    criticality: high
    tags:
    - zeek
    - network_monitoring
    - security_sensor

# Used when an IP does not match any configured zone or exact asset.
fallback_context:
  internal:
    role: internal_unknown
    trust_level: internal
    sensitivity: unknown
    managed: false
    trusted: false

  external:
    role: external
    trust_level: untrusted
    sensitivity: unknown
    managed: false
    trusted: false
